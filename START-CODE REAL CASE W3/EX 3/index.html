<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        padding: 30px;
        background-color: rgb(187, 194, 201);
      }
      .plan-title{
        align-self: stretch;
        text-align: center;
        padding: 20px;
        background-color:#e0309f;
        border-radius: 20px 20px 0 0;
        color: white;
      }
      .pricing-plan{
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: aliceblue;
        flex: 1;
        max-width: 350px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        border-radius: 20px;
      }
      .pricing-container{
        display: flex;
        border-radius: 20px;
        justify-content: space-evenly;
        gap: 20px;
      }
      button{
        background-color:#e0309f;
        border-radius: 30px;
        margin-bottom: 20px;
        padding: 12px 40px;
        color: white;
        font-weight: bold;
        border: none;
      }
      .plan-features li {
        border-bottom: 1px solid #ddd;
        padding: 10px 0;
        margin: 0 20px;
        color: #888;
      }

      .plan-title,button,.plan-price{
        text-transform: uppercase;
      }

      .plan-price{
        margin: 20px 0;
        color:  #9217a2;
      }
      .plan-features {
        flex-grow: 1;
        list-style: none;
        padding: 0;
      }
      .plan-button:hover{
        background-color:#c0207f;
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title basic">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title standard">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title premium">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
